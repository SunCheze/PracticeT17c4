global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'serving-production'
    metrics_path: /metrics
    static_configs:
      - targets: ['serving-production:8000']
        labels: { service: 'serving', stage: 'production' }

  - job_name: 'serving-canary'
    metrics_path: /metrics
    static_configs:
      - targets: ['serving-canary:8000']
        labels: { service: 'serving', stage: 'canary' }

  - job_name: 'traffic-router'
    metrics_path: /nginx_status
    static_configs:
      - targets: ['traffic-router:80']

  - job_name: 'mlflow'
    metrics_path: /metrics
    static_configs:
      - targets: ['mlflow:5000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
