# =============================================================================
# Traffic router для blue/green-промоушена модели.
#
# Веса production / canary меняются Ansible'ом или скриптом из Airflow-DAG
# `promote_model` через `docker exec traffic-router nginx -s reload`.
#
# Состояния:
#   1. Нормальный режим:     weight=100 production, weight=0 canary  (canary down)
#   2. Shadow (off-traffic): canary получает копию запросов через mirror, но
#                            её ответ клиенту не возвращается (только для метрик).
#   3. Canary:               weight=90 production, weight=10 canary
#   4. После promote:        weight=0 production, weight=100 canary
#                            (та же canary становится новой production при
#                             следующем деплое)
#   5. Rollback:             weight=100 production, weight=0 canary
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    log_format main_with_upstream
        '$remote_addr - "$request" $status '
        '$body_bytes_sent "$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_response_time=$upstream_response_time '
        'request_time=$request_time';
    access_log /var/log/nginx/access.log main_with_upstream;

    # ----- upstream блоки. Веса — единственный артефакт для promote. -----
    upstream model_production {
        server serving-production:8000 weight=100 max_fails=3 fail_timeout=30s;
        server serving-canary:8000     weight=0   backup;       # backup пока вес 0
    }

    upstream model_canary_shadow {
        server serving-canary:8000;
    }

    server {
        listen 80;

        # ----- healthcheck для самого роутера -----
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ----- основной маршрут /score -----
        location /score {
            proxy_pass http://model_production;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;

            # Shadow-зеркало: на canary улетает копия запроса, ответ не ждём.
            # Включается через nginx -s reload с раскомментированной строкой.
            # mirror /score_shadow;
            # mirror_request_body on;
        }

        # ----- shadow-endpoint (не возвращает ответ клиенту) -----
        location = /score_shadow {
            internal;
            proxy_pass http://model_canary_shadow/score;
            proxy_set_header X-Shadow "true";
            proxy_set_header Host $host;
        }

        # ----- метрики Prometheus -----
        location /nginx_status {
            stub_status;
            access_log off;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
