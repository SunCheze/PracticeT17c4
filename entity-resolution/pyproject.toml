[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution"
version = "0.1.0"
description = "Поиск дубликатов клиентских профилей маркетплейса"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Entity Resolution Team" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.0,<4.0",
  "scikit-learn>=1.3,<2.0",
  "catboost>=1.2,<2.0",
  "networkx>=3.0,<4.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
er-train = "scripts.train:main"
er-predict = "scripts.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
